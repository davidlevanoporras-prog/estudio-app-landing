[package]
name = "app"
version = "0.1.0"
description = "Excellence absolue — panel de estudio nativo de escritorio"
authors = ["Excellence absolue"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2.5.4"
# "Bóveda de Titanio" (Misión 1): motor de persistencia clave-valor nativo,
# respaldado por un único archivo en disco por store — ver `lib.rs` para el
# registro del plugin y `src/lib/appStore.ts` (frontend) para el consumo.
tauri-plugin-store = "2"
